<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Acre | Redwood Forest Foundation</title>
  <link rel="stylesheet" href="/rff/css/site.css" />
</head>
<body class="">
  <header class="site-header">
    <div class="inner">
      <a class="brand" href="/rff" aria-label="Redwood Forest Foundation: sponsorship home">
        <span class="word">REDWOOD</span><span class="sub">FOREST FOUNDATION</span>
      </a>
      <nav class="site-nav" aria-label="Sponsorship"><a href="/rff/acres-map">Sponsor an acre</a><a href="/rff/blocks-map">Sponsor a microwatershed</a></nav>
      <div class="header-actions">
        <a class="btn btn-sm btn-outline-rust" href="https://redwoodforests.org/">redwoodforests.org</a>
      </div>
    </div>
  </header>
  <main>
    <section class="page">
      <div class="wrap acre-layout">
        <div>
          <img id="acre-image" alt="Aerial view of this acre" />
          <p id="acre-status"></p>
        </div>
        <div>
          <p class="kicker">Sponsor an acre</p>
          <h1 class="display" id="acre-title">Loading…</h1>
          <p class="lede" id="acre-desc"></p>
          <div id="acre-action-panel"></div>
        </div>
      </div>
    </section>
  </main>
  <footer class="site-footer">
    <div class="wrap">
      <div><strong>Redwood Forest Foundation</strong><br>Tax ID #68-0404767 · 501(c)(3) tax-exempt organization</div>
      <div><a href="https://redwoodforests.org/">redwoodforests.org</a></div>
    </div>
  </footer>
  <script type="module" src="/rff/js/acre.js"></script>
</body>
</html>
